<!DOCTYPE html>
<html>
<head>
  <title>Movie Cloud</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Movie Cloud</h1>
  <input id="search" placeholder="Search movies...">
</header>

<section class="hero">
  <h2>Stream Your Movie Library Anywhere</h2>
  <p>Upload, organize, tag, and watch your movies from the cloud.</p>
</section>

<section class="player-section">
  <h2>Now Playing</h2>

  <div class="player-container">
    <video id="videoPlayer" controls>
      <source src="http://localhost:3000/video" type="video/mp4">
      <track src="subtitles/sample.vtt" kind="subtitles" srclang="en" label="English">
    </video>
  </div>
</section>

<section class="upload-section">
  <h2>Add Movie</h2>
  <input id="title" placeholder="Movie Title">
  <input id="tag" placeholder="Tag">
  <input id="age" placeholder="Age Rating">
  <input id="image" type="file">
  <button onclick="addMovie()">Add Movie</button>
</section>

<section id="movieGrid" class="grid"></section>

<script src="app.js"></script>
</body>
</html>
